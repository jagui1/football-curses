<div
  class="witch-modal-backdrop"
  role="presentation"
  (click)="onBegone()"
></div>
<div
  class="witch-modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="witch-modal-title"
  (click)="$event.stopPropagation()"
>
  @if (flash()) {
    <div class="witch-modal__flash" aria-hidden="true"></div>
  }
  <h2 id="witch-modal-title" class="witch-modal__title">
    🧙‍♀️ Identify Yourself, Witch
  </h2>
  <label class="witch-modal__label" for="witch-pwd">Password</label>
  <input
    #pwdInput
    id="witch-pwd"
    class="witch-modal__input"
    [class.witch-modal__input--shake]="inputShake()"
    type="password"
    autocomplete="off"
    placeholder="Enter the incantation..."
    [(ngModel)]="passwordInput"
    (keydown.enter)="onConfirm()"
  />
  @if (error()) {
    <p class="witch-modal__err" role="alert">{{ error() }}</p>
  }
  <p class="witch-modal__attempts" aria-live="polite">
    Attempts remaining: {{ attemptsRemaining() }}
  </p>
  <div class="witch-modal__actions">
    <button type="button" class="btn btn--primary" (click)="onConfirm()">
      Enter the Circle 🔮
    </button>
    <button type="button" class="btn btn--ghost" (click)="onBegone()">
      Begone
    </button>
  </div>
</div>
